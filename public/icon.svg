<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rotorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer Pressure Gauge Rim -->
  <circle cx="256" cy="230" r="140" fill="#0f172a" stroke="#e2e8f0" stroke-width="12" />
  <circle cx="256" cy="230" r="126" fill="#1e293b" />
  
  <!-- Gauge Ticks -->
  <circle cx="256" cy="230" r="110" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="8 14" />
  <path d="M 170 290 A 110 110 0 1 1 342 290" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 310 180 A 110 110 0 0 1 342 290" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
  
  <!-- Industrial Compressor Screw Rotors / Turbine blades -->
  <g transform="translate(256,230)">
    <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <!-- Pressure Needle -->
    <line x1="0" y1="0" x2="45" y2="-65" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="12" fill="#f59e0b" />
    <!-- Air Flow Waves -->
    <path d="M -26 -10 Q 0 -35 26 -10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M -20 12 Q 0 -10 20 12" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Industrial Banner: AIRMAINT 360 -->
  <rect x="64" y="396" width="384" height="64" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#f8fafc" text-anchor="middle" letter-spacing="3">AIRMAINT 360</text>
  <circle cx="96" cy="428" r="6" fill="#22c55e" />
  <circle cx="416" cy="428" r="6" fill="#38bdf8" />
</svg>
